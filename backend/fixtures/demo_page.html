<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>校园网络安全讲座报名</title>
  </head>
  <body>
    <main>
      <h1>校园网络安全讲座报名</h1>
      <p>报名需要姓名和学号。</p>
      <form action="/registration" method="post">
        <label>姓名 <input name="name" type="text"></label>
        <label>学号 <input name="student_id" type="text"></label>
        <button type="submit">提交报名</button>
      </form>
    </main>
  </body>
</html>
